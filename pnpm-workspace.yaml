# Do not adopt new versions of dependency libraries within the first 24 hours of their release (to reduce the risk of supply chain attacks).
minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - '@ota-meshi/*'
  - '@oxc-project/*'
  - '@rolldown/*'
  - '@sveltejs/*'
  - create-vite
  - devalue
  - esm-env
  - esrap
  - is-reference
  - locate-character
  - rolldown-vite
  - rolldown
  - svelte
  - typescript-eslint-parser-for-extra-files
  - vite
  - zimmerframe
  # Renovate security update: postcss@8.5.10 || 8.5.18 || 8.5.23
  - postcss@8.5.10 || 8.5.18 || 8.5.23
  # Renovate security update: esbuild@0.28.1
  - esbuild@0.28.1
  # Renovate security update: postcss-selector-parser@7.1.3
  - postcss-selector-parser@7.1.3
